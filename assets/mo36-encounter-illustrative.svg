 <title id="chart-title">Salt screening in an assumed Mo36 encounter model</title><desc id="chart-desc">Illustrative saved model values, not measurements. Added NaCl 0, 0.03, 0.08, and 0.18 M gives electrical encounter log-weight L of 6.290, 3.812, 2.181, 0.994 for the point representation and 6.744, 4.478, 2.957, 1.757 for the shell representation. ASSUMED Fe +50 mV / Si 0 mV, z = -8, gap 0.5 nm. Zero means equal electrical encounter weights. Representation sensitivity is not a confidence interval. This is not a survival or preservation result. Unknown surface potentials can reverse the preference. See the companion CSV.</desc><title>Salt screening in an assumed Mo36 encounter model</title>
