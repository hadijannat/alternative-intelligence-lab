 <title id="chart-title">CCO pilot: the registered hypothesis was unsupported</title><desc id="chart-desc">Saved pilot v1 results, 2026-10-09. Campaign: 24 runs across eight architectures, three seeds each. Selected model means shown, without uncertainty bars. In-distribution correctness: CCO 128 49.67%, independent cells 128 50.59%, centralized recurrent 50.00%, recurrent GNN 100.00%. Out-of-distribution larger size, concentrated allocation, longer path: CCO 128 50.52%, 50.69%, 50.26%; GNN 98.96%, 100.00%, 51.39%. Chance is 50%. CCO stays near chance; GNN fails on longer paths. This bounded negative result does not generalize to all communicating neural systems.</desc><title>CCO pilot: the registered hypothesis was unsupported</title>
