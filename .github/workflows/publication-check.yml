name: Publication integrity
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Verify saved publication assets
        run: python3 tools/verify_publication.py
      - name: Verify October 18 publication boundary and negative results
        run: |
          python3 tools/verify_october18.py
          python3 -m unittest discover -s tests -p 'test_export_october18.py'
      - name: Check follow-up export boundaries
        run: python3 -m unittest discover -s tests -p 'test_export_followup.py'
      - name: Check parent-pilot supervisor with harmless children
        run: python3 -m unittest discover -s research/2026-10-15/recursive-compound-2026-10-15/parent-pilot -p test_pilot.py
      - name: Check published-parent parser with synthetic inputs
        run: python3 -m unittest discover -s research/2026-10-15/recursive-compound-2026-10-15/published-parent -p test_analysis.py
      - name: Check proton topology and GUI bonds with synthetic inputs
        run: python3 -m unittest discover -s research/2026-10-15/recursive-compound-2026-10-15/proton-topology -p 'test_*.py'
      - name: Check crash extraction and allocation model with synthetic inputs
        run: python3 -m unittest discover -s research/2026-10-15/recursive-compound-2026-10-15/parent-saved-j-crash-diagnostic -p 'test_*.py'
